name: Pruebas y publicación de Bía

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Lógica pura (fechas, unidades, 1RM, esfuerzo, creatina, comidas, Bía) con node:test. Sin dependencias.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pruebas
        run: node --test "tests/*.test.js"

  # Solo publica si las pruebas pasan y es un push a main (no en pull requests).
  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Solo se publica la app. Quedan fuera documentos, pruebas y carpetas de agentes
      # (.agents/, .cursor/…, con un ejecutable). Un archivo nuevo de la app va aquí y en ASSETS de sw.js.
      - name: Build site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js .nojekyll css js fonts icons _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
